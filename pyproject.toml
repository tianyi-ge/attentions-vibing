[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attentions-vibing"
version = "0.1.0"
description = "Practice-first attention kernel benchmarking scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
attn-bench = "attentions.cli:main"

[tool.setuptools.packages.find]
include = ["attentions*"]
